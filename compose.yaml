# Run hars with Docker Compose. See docs/INSTALL.md#docker-compose (most
# people use the one-command install in README.md instead).
#
#   docker compose up -d   # then open http://<host>:8123 and follow the onboarding
#
# The image is pulled from ghcr.io (published by .github/workflows/publish.yml).
# If it can't be pulled and this file sits in a clone of the repository,
# Compose builds it from the Dockerfile instead.
services:
  hars:
    image: ghcr.io/adamt94/hars:latest
    build: .
    container_name: hars
    # LAN devices (LIFX broadcast discovery, mDNS) need the host's network.
    # hars listens on port 8123 of the host (set HARS_BIND to change it).
    network_mode: host
    volumes:
      # Everything hars keeps: logins, registries, dashboards, history.
      - ./config:/config
    restart: unless-stopped
    # On stop, hars finishes requests (up to 5 s), then saves and flushes
    # history. Give it time to do that before Docker kills it.
    stop_grace_period: 1m
